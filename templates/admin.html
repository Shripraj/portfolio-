<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="api-base" content="{{ api_base }}">
  <meta name="public-url" content="{{ public_url }}">
  <title>Portfolio admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
  <script src="{{ url_for('static', filename='admin.js') }}" defer></script>
</head>
<body>
  <div id="app-loading" class="boot">Loading…</div>

  <section id="login" class="login" hidden>
    <form id="login-form" class="login__card" novalidate>
      <p class="login__eyebrow">Private dashboard</p>
      <h1 class="login__title">Sign in</h1>
      <p class="login__note">Accounts are created from the command line. There is no public registration.</p>
      <div class="field"><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" required></div>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit" id="login-submit">Sign in</button>
    </form>
  </section>

  <div id="shell" class="shell" hidden>
    <aside class="sidebar" aria-label="Dashboard sections">
      <div class="sidebar__brand">
        <span class="sidebar__name">Portfolio admin</span>
        <a class="sidebar__site" id="view-site" href="#" target="_blank" rel="noopener">View site ↗</a>
      </div>
      <nav id="nav" class="sidebar__nav"></nav>
      <div class="sidebar__foot">
        <span id="whoami" class="muted"></span>
        <button class="btn btn--small btn--ghost" id="logout" type="button">Sign out</button>
      </div>
    </aside>

    <main class="content" id="content" tabindex="-1">
      <div id="progress" class="progress" aria-hidden="true"></div>
    </main>
  </div>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__panel">
      <header class="modal__head">
        <h2 id="modal-title" class="modal__title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </header>
      <div id="modal-body" class="modal__body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
