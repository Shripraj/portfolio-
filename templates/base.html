<!doctype html>
<html lang="en" data-theme="{{ default_theme or 'light' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page_title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ meta_description }}{% endblock %}">
  {% if keywords %}<meta name="keywords" content="{{ keywords }}">{% endif %}
  <meta name="author" content="{{ profile.name }}">
  <meta name="theme-color" content="#F5F2EB">
  <link rel="canonical" href="{{ canonical or (request.host_url.rstrip('/') ~ request.path) }}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:title" content="{% block og_title %}{{ page_title }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ meta_description }}{% endblock %}">
  <meta property="og:url" content="{{ canonical or '' }}">
  {% if profile.photo %}<meta property="og:image" content="{{ profile.photo.url }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
  {% if profile.name %}<script type="application/ld+json">{{ {"@context": "https://schema.org", "@type": "Person", "name": profile.name, "jobTitle": profile.primary_title, "address": profile.location, "sameAs": [profile.linkedin_url, profile.github_url] | select | list, "url": canonical or ""} | tojson }}</script>{% endif %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block header %}{% endblock %}
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  {% block footer %}{% endblock %}
  <script src="{{ url_for('static', filename='js/site.js') }}" defer></script>
</body>
</html>
